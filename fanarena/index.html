<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FanArena</title>
  <meta name="theme-color" content="#100d14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #100d14;
      --surface: #1a1622;
      --surface-2: #241e2e;
      --fg: #f6f1ea;
      --muted: #a398ad;
      --primary: #ff6a1a;
      --primary-fg: #1a0d06;
      --teal: #2ee6c7;
      --pink: #ff4d8d;
      --line: #342c40;
      --radius: 1.25rem;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      line-height: 1.5;
    }
    button, a { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--bg) 95%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .bar, .tabs, main { max-width: 64rem; margin: 0 auto; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
    }
    .logo { font-family: Syne, sans-serif; font-weight: 800; font-size: 1.125rem; line-height: 1; }
    .logo span { color: var(--primary); }
    .sub { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.75rem; }
    .tabs {
      display: flex;
      gap: 0.25rem;
      overflow-x: auto;
      padding: 0 0.75rem 0.5rem;
    }
    .tab, .btn, .btn-ghost {
      height: 2.75rem;
      border-radius: 999px;
      border: 0;
      padding: 0 0.9rem;
      white-space: nowrap;
    }
    .tab { background: transparent; color: var(--muted); }
    .tab.active { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
    .btn { background: var(--primary); color: var(--primary-fg); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
    .btn-ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); text-decoration: none; display: inline-flex; align-items: center; }
    .btn-soft { background: var(--surface-2); color: var(--fg); font-weight: 600; }
    main { padding: 1.25rem 1rem 2.5rem; }
    h1, h2 { font-family: Syne, sans-serif; margin: 0.4rem 0 0; line-height: 1.05; }
    h1 { font-size: 2rem; font-weight: 800; }
    h2 { font-size: 1.35rem; }
    .kicker { margin: 0; color: var(--teal); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    .kicker.pink { color: var(--pink); }
    .muted { color: var(--muted); }
    .pink { color: var(--pink); }
    .teal { color: var(--teal); }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1rem;
    }
    .card.dash { border-style: dashed; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .market { padding: 0.75rem; }
    .px { font-family: Syne, sans-serif; font-size: 1.25rem; font-weight: 700; margin: 0.25rem 0 0; }
    input, textarea {
      width: 100%;
      margin-top: 0.5rem;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 0.7rem 0.75rem;
    }
    textarea { min-height: 5rem; resize: vertical; }
    .split { display: flex; justify-content: space-between; gap: 0.75rem; align-items: center; }
    iframe { width: 100%; height: 70vh; border: 0; background: #000; border-radius: var(--radius); margin-top: 1rem; }
    .hidden { display: none !important; }
    .err { color: var(--pink); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <div class="logo">Fan<span>Arena</span></div>
        <p class="sub">Live on Strike</p>
      </div>
      <button id="walletBtn" class="btn" type="button">Connect wallet</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="app"></main>
  <script type="module">
    const CEO = [
      "0x76197edba4f22d96103b84743ed4e7309d432cec",
      "0x1f8c218d09b37e15aa429f37ad934947b96bde2f",
    ];
    const STRIKE = "https://api.strikefinance.org";
    const STRIKE_APP = "https://app.strikefinance.org";
    const FEATURED = ["BTC-USD", "ETH-USD", "SOL-USD", "ADA-USD", "XRP-USD", "HYPE-USD"];
    const TABS = [
      ["dashboard", "Dashboard"],
      ["creators", "Creators"],
      ["tournaments", "Tournaments"],
      ["tokens", "Fan Tokens"],
      ["marketplace", "Marketplace"],
      ["portfolio", "Portfolio"],
      ["rewards", "Rewards"],
      ["leaderboard", "Leaderboard"],
    ];
    const DEFAULT_CREATOR = {
      name: "Andrei RPK",
      bio: "Building games on Remix.",
      remixUrl: "https://remix.gg/@andrei_rpk",
    };
    const DEFAULT_GAMES = [{
      id: 1,
      title: "Endgame Legends",
      url: "https://remix.gg/g/endgame-legends",
      description: "Choose your legendary hero and defend a ruined compound from an invading alien army. Co-op mode available.",
    }];

    const $ = (id) => document.getElementById(id);
    const state = {
      tab: "dashboard",
      address: null,
      busy: false,
      walletError: "",
      frame: "",
      board: null,
      loading: true,
      builderCode: localStorage.getItem("fanarena.builder") || "",
      link: null,
      linkError: "",
      linking: false,
      adminStatus: "",
      creator: load("fa_pinned", DEFAULT_CREATOR),
      games: load("fa_games", DEFAULT_GAMES),
    };

    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }
    function save(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "\u0026amp;",
        "<": "\u0026lt;",
        ">": "\u0026gt;",
        '"': "\u0026quot;",
        "'": "\u0026#39;",
      })[c]);
    }

    function short(address) {
      return address ? address.slice(0, 6) + "…" + address.slice(-4) : "";
    }
    function isCeo(address) {
      return !!address && CEO.some((w) => w.toLowerCase() === address.toLowerCase());
    }
    function money(value, digits = 0) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "—";
      return n.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: digits, minimumFractionDigits: digits });
    }
    function price(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "—";
      const digits = n >= 1000 ? 2 : n >= 1 ? 4 : 6;
      return n.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: digits });
    }
    function funding(value) {
      const n = Number(value);
      return Number.isFinite(n) ? (n * 100).toFixed(4) + "%" : "—";
    }
    function percent(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "—";
      const shown = Math.abs(n) <= 2 ? n * 100 : n;
      return (shown > 0 ? "+" : "") + shown.toFixed(1) + "%";
    }
    function httpsOnly(url) {
      try {
        const parsed = new URL(url);
        return parsed.protocol === "https:" ? parsed.href : "";
      } catch {
        return "";
      }
    }

    function eth() { return window.ethereum || null; }

    async function connect() {
      state.walletError = "";
      const provider = eth();
      if (!provider) {
        state.walletError = "No wallet in this browser. Open FanArena in Rabby or MetaMask.";
        render();
        return;
      }
      state.busy = true;
      render();
      try {
        const accounts = await provider.request({ method: "eth_requestAccounts" });
        state.address = accounts[0] || null;
        readLink();
      } catch (err) {
        state.walletError = err && err.code === 4001 ? "Connection rejected." : "Could not connect the wallet.";
      } finally {
        state.busy = false;
        render();
      }
    }

    async function disconnect() {
      const provider = eth();
      try {
        await provider?.request({ method: "wallet_revokePermissions", params: [{ eth_accounts: {} }] });
      } catch { /* some wallets cannot revoke */ }
      state.address = null;
      state.link = null;
      if (state.tab === "admin") state.tab = "dashboard";
      render();
    }

    async function signMessage(message, account) {
      const provider = eth();
      if (!provider) throw new Error("No wallet in this browser.");
      const hex = "0x" + [...new TextEncoder().encode(message)].map((b) => b.toString(16).padStart(2, "0")).join("");
      try {
        return await provider.request({ method: "personal_sign", params: [hex, account] });
      } catch (err) {
        if (err && err.code === 4001) throw new Error("Signature rejected.");
        return provider.request({ method: "personal_sign", params: [message, account] });
      }
    }

    function readLink() {
      state.link = null;
      if (!state.address) return;
      state.link = load("fanarena.strike." + state.address.toLowerCase(), null);
    }

    async function linkStrike() {
      state.linkError = "";
      if (!state.address) {
        state.linkError = "Connect a wallet first.";
        render();
        return;
      }
      const code = state.builderCode.trim();
      if (code.length < 2) {
        state.linkError = "Paste the builder code from your Strike dashboard.";
        render();
        return;
      }
      state.linking = true;
      render();
      try {
        const ed = await import("https://esm.sh/@noble/ed25519@3.2.0");
        const keys = await ed.keygenAsync();
        const publicKey = [...keys.publicKey].map((b) => b.toString(16).padStart(2, "0")).join("");
        const requested = await fetch(STRIKE + "/auth/builder/request-signature", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            address: state.address,
            chain: "ethereum",
            code,
            fee_share_bps: 50,
            public_key: publicKey,
          }),
        }).then((r) => r.json());
        if (!requested.message_to_sign || !requested.nonce) {
          throw new Error(requested.error || "Strike refused the builder link.");
        }
        const signature = await signMessage(requested.message_to_sign, state.address);
        const verified = await fetch(STRIKE + "/auth/builder/verify-signature", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ nonce: requested.nonce, wallet_signature: signature }),
        }).then((r) => r.json());
        if (!verified.account_id) throw new Error(verified.error || "Strike did not accept the signature.");
        state.link = {
          accountId: verified.account_id,
          builderCode: verified.builder_code || code,
          feeShareBps: verified.fee_share_bps ?? 50,
        };
        localStorage.setItem("fanarena.builder", code);
        save("fanarena.strike." + state.address.toLowerCase(), state.link);
      } catch (err) {
        state.linkError = err instanceof Error ? err.message : "Could not link Strike.";
      } finally {
        state.linking = false;
        render();
      }
    }

    async function loadBoard() {
      state.loading = true;
      try {
        const [pricesRes, tradersRes, vaultsRes] = await Promise.allSettled([
          fetch(STRIKE + "/price/v2/premiumIndex").then((r) => r.json()),
          fetch(STRIKE + "/v2/copy/discover?platform=strike&limit=8&sort=pnl_30d&order=desc").then((r) => r.json()),
          fetch(STRIKE + "/v2/vaults?limit=4").then((r) => r.json()),
        ]);
        const markets = [];
        if (pricesRes.status === "fulfilled" && Array.isArray(pricesRes.value)) {
          const by = new Map(pricesRes.value.map((row) => [row.symbol, row]));
          for (const symbol of FEATURED) {
            const row = by.get(symbol);
            if (!row) continue;
            markets.push({ symbol, markPrice: String(row.markPrice), fundingRate: String(row.fundingRate || "0") });
          }
        }
        const traders = tradersRes.status === "fulfilled" && Array.isArray(tradersRes.value?.items)
          ? tradersRes.value.items.map((row) => ({
              address: row.blockchain_address,
              equity: String(row.account_value || "0"),
              pnl30d: String(row.pnl?.["30d"] || "0"),
              roi30d: String(row.roi?.["30d"] || "0"),
            })).filter((row) => row.address)
          : [];
        const vaults = vaultsRes.status === "fulfilled" && Array.isArray(vaultsRes.value?.vaults)
          ? (vaultsRes.value.vaults || []).filter((row) => !row.status || row.status === "active").slice(0, 4).map((row) => ({
              name: row.name || "Vault",
              equity: String(row.equity || "0"),
              apr: String(row.apr || "0"),
              depositors: Number(row.depositors || 0),
            }))
          : [];
        state.board = {
          markets,
          traders,
          vaults,
          error: markets.length + traders.length + vaults.length === 0 ? "Strike is unreachable right now." : "",
        };
      } catch {
        state.board = { markets: [], traders: [], vaults: [], error: "Strike is unreachable right now." };
      } finally {
        state.loading = false;
        render();
      }
    }

    function card(inner, extra = "") {
      return `<article class="card ${extra}">${inner}</article>`;
    }

    function marketsHtml() {
      const board = state.board;
      if (state.loading) {
        return `<div class="grid">${Array.from({ length: 6 }, () => `<div class="card market" style="height:6rem"></div>`).join("")}</div>`;
      }
      const cards = (board?.markets || []).map((m) => card(`
        <p class="muted" style="margin:0;font-size:.75rem">${esc(m.symbol.replace("-USD", ""))}</p>
        <p class="px">${esc(price(m.markPrice))}</p>
        <p class="muted" style="margin:.25rem 0 0;font-size:.75rem">Funding ${esc(funding(m.fundingRate))}</p>
      `, "market")).join("");
      const vaults = (board?.vaults || []).map((v) => `
        <div class="card split">
          <div>
            <strong>${esc(v.name)}</strong>
            <p class="muted" style="margin:.2rem 0 0;font-size:.75rem">${esc(money(v.equity))} · ${esc(v.depositors)} depositors</p>
          </div>
          <span class="${Number(v.apr) >= 0 ? "teal" : "pink"}">${esc(percent(v.apr))}</span>
        </div>`).join("");
      const linked = state.link
        ? `<p class="teal">Linked · ${esc(state.link.builderCode || "builder")} · ${esc(short(state.link.accountId))}</p>`
        : "";
      return `
        ${board?.error ? `<p class="err">${esc(board.error)}</p>` : ""}
        <div class="grid">${cards}</div>
        <div class="row"><a class="btn" href="${STRIKE_APP}" target="_blank" rel="noreferrer">Trade on Strike</a></div>
        ${card(`
          <h2>Link your builder code</h2>
          <p class="muted">This signs Strike’s message with your wallet. Fee cap is 0.50%. FanArena cannot withdraw. Points still wait for a confirmed fill.</p>
          ${linked}
          <label class="muted" for="builder">Builder code</label>
          <input id="builder" value="${esc(state.builderCode)}" placeholder="From the Strike dashboard" autocomplete="off" spellcheck="false">
          <div class="row"><button class="btn btn-soft" id="linkBtn" type="button" ${state.linking || !state.address ? "disabled" : ""}>${state.linking ? "Waiting for signature…" : state.address ? "Sign and link Strike" : "Connect wallet to link"}</button></div>
          ${state.linkError ? `<p class="err">${esc(state.linkError)}</p>` : ""}
        `)}
        ${vaults ? `<h2 style="margin-top:1rem">Vaults</h2>${vaults}` : ""}
      `;
    }

    function frameHtml(url, title) {
      const safe = httpsOnly(url);
      if (!safe || state.frame !== url) return "";
      return `<iframe title="${esc(title)}" src="${esc(safe)}"></iframe>`;
    }

    function dashboard() {
      const g = state.games[0];
      const rest = state.games.slice(1).map((game) => card(`
        <h2>${esc(game.title)}</h2>
        <p class="muted">${esc(game.description)}</p>
        <div class="row"><a class="teal" href="${esc(httpsOnly(game.url))}" target="_blank" rel="noreferrer">Open game</a></div>
      `)).join("");
      return `
        <p class="kicker">Remix creators</p>
        <h1>Call the board.</h1>
        <p class="muted">FanArena is the creator floor. Profiles and games stay on Remix. Perps run on Strike. Points do not move because someone opened a link.</p>
        ${card(`
          <p class="kicker pink">Pinned creator</p>
          <h2>${esc(state.creator.name)}</h2>
          <p class="muted">${esc(state.creator.bio)}</p>
          <div class="row">
            <button class="btn" type="button" data-frame="${esc(state.creator.remixUrl)}">${state.frame === state.creator.remixUrl ? "Close profile" : "Open profile"}</button>
            <a class="btn-ghost" href="${esc(state.creator.remixUrl)}" target="_blank" rel="noreferrer">remix.gg</a>
          </div>
        `)}
        ${g ? card(`
          <p class="kicker">Top game</p>
          <h2>${esc(g.title)}</h2>
          <p class="muted">${esc(g.description || "Playable on Remix.")}</p>
          <div class="row">
            <button class="btn btn-soft" type="button" data-frame="${esc(g.url)}">${state.frame === g.url ? "Close game" : "Open game"}</button>
            <a class="btn-ghost" href="${esc(g.url)}" target="_blank" rel="noreferrer">Play on Remix</a>
          </div>
        `) : ""}
        ${rest}
        ${frameHtml(state.frame, "Remix")}
        ${card(`
          <p class="kicker" style="color:var(--muted)">Tournaments</p>
          <h2>No live boards</h2>
          <p class="muted">Entry will cost 2 points from confirmed Strike fills. Nothing is posted yet, and opening Strike does not mint those points.</p>
          <div class="row"><button class="btn-ghost" type="button" data-tab="tournaments">Open tournaments</button></div>
        `, "dash")}
      `;
    }

    function creators() {
      return `
        <p class="kicker">Explore</p>
        <h1>Creators</h1>
        <p class="muted">Pinned from the admin panel. More creators are not invented.</p>
        ${card(`
          <h2>${esc(state.creator.name)}</h2>
          <p class="muted">${esc(state.creator.bio)}</p>
          <div class="row">
            <button class="btn" type="button" data-frame="${esc(state.creator.remixUrl)}">${state.frame === state.creator.remixUrl ? "Close profile" : "View profile"}</button>
            <a class="btn-ghost" href="${esc(state.creator.remixUrl)}" target="_blank" rel="noreferrer">remix.gg</a>
          </div>
        `)}
        ${frameHtml(state.frame, "Remix profile")}
      `;
    }

    function tournaments() {
      return `
        <p class="kicker">Boards</p>
        <h1>Tournaments</h1>
        ${card(`
          <h2>Need 2 points to join</h2>
          <p class="muted">Earn them from confirmed Strike fills, not from opening the app.</p>
          <p class="teal" style="font-weight:600">You have 0 points</p>
        `)}
      `;
    }

    function tokens() {
      return `
        <p class="kicker">Holdings</p>
        <h1>Fan Tokens</h1>
        <p class="muted">No fan token is listed yet. Strike markets on Rewards are perps, not creator tokens.</p>
      `;
    }

    function marketplace() {
      return `
        <p class="kicker">Exchange</p>
        <h1>Marketplace</h1>
        <p class="muted">No listings yet. Nothing here is for sale.</p>
      `;
    }

    function portfolio() {
      if (!state.address) {
        return `
          <p class="kicker">Wallet</p>
          <h1>Portfolio</h1>
          ${card(`
            <p class="muted">Connect a wallet to attach this portfolio to an address.</p>
            <div class="row"><button class="btn" id="connectInline" type="button">Connect wallet</button></div>
          `)}
        `;
      }
      return `
        <p class="kicker">Wallet</p>
        <h1>Portfolio</h1>
        ${card(`
          <strong>${esc(short(state.address))}</strong>
          <p class="muted">Points: 0</p>
          <p class="muted">Fan tokens: none listed</p>
          <p class="muted">${state.link ? "Strike builder linked · " + esc(state.link.builderCode || "code") : "Strike builder not linked"}</p>
        `)}
      `;
    }

    function rewards() {
      return `
        <p class="kicker">Points</p>
        <h1>0</h1>
        <p class="muted">${state.address ? esc(short(state.address)) + " has no confirmed Strike fills through FanArena." : "Connect a wallet to attach points to a real address."}</p>
        ${card(`
          <strong>How a point is earned</strong>
          <ol class="muted">
            <li>Connect the same Ethereum wallet you trade with.</li>
            <li>Link a Strike builder code and sign their message.</li>
            <li>A fill has to come back from Strike. Opening the app does not count.</li>
          </ol>
          <p class="muted">${state.link ? "Builder " + esc(state.link.builderCode || "code") + " is linked. Fills are not credited yet because FanArena does not invent them." : "No builder is linked for this wallet."}</p>
        `)}
        <p class="kicker" style="margin-top:1.25rem">Strike perps</p>
        <h2>Markets</h2>
        <p class="muted">Prices are live from Strike. Trading happens in their app until your builder code is linked. Fan tokens are not listed here.</p>
        ${marketsHtml()}
      `;
    }

    function leaderboard() {
      const rows = state.loading
        ? Array.from({ length: 5 }, () => `<div class="card" style="height:4rem"></div>`).join("")
        : (state.board?.traders || []).map((t, i) => {
            const pnl = Number(t.pnl30d);
            return `<div class="card split">
              <div><strong>${i + 1}. ${esc(short(t.address))}</strong><p class="muted" style="margin:.2rem 0 0;font-size:.75rem">Equity ${esc(money(t.equity))}</p></div>
              <div style="text-align:right"><strong class="${pnl >= 0 ? "teal" : "pink"}">${pnl >= 0 ? "+" : ""}${esc(money(t.pnl30d))}</strong><p class="muted" style="margin:.2rem 0 0;font-size:.75rem">${esc(percent(t.roi30d))} ROI</p></div>
            </div>`;
          }).join("") || `<p class="muted">No public Strike traders came back.</p>`;
      return `
        <p class="kicker">Public board</p>
        <h1>Leaderboard</h1>
        <p class="muted">30-day PnL from Strike’s public copy list. Not a fan-points ranking.</p>
        ${state.board?.error ? `<p class="err">${esc(state.board.error)}</p>` : ""}
        ${rows}
      `;
    }

    function admin() {
      const games = state.games.map((g) => `
        <div class="split" style="margin-top:.5rem">
          <span>${esc(g.title)}</span>
          <button class="btn-ghost" type="button" data-remove="${esc(g.id)}" style="color:var(--pink)">Remove</button>
        </div>`).join("");
      return `
        <p class="kicker">CEO</p>
        <h1>Admin</h1>
        <p class="muted">Both CEO wallets have the same control. In this single file, saves stay in this browser. There is no password.</p>
        ${card(`
          <h2>Pinned creator</h2>
          <input id="pinName" value="${esc(state.creator.name)}" placeholder="Creator name">
          <textarea id="pinBio" placeholder="Short bio">${esc(state.creator.bio)}</textarea>
          <input id="pinUrl" value="${esc(state.creator.remixUrl)}" placeholder="https://remix.gg/@name">
          <div class="row"><button class="btn" id="saveCreator" type="button">Save creator</button></div>
        `)}
        ${card(`
          <h2>Top games</h2>
          ${games}
          <input id="gameTitle" placeholder="Game title">
          <input id="gameUrl" placeholder="https://remix.gg/g/…">
          <input id="gameDesc" placeholder="Description">
          <div class="row"><button class="btn btn-soft" id="addGame" type="button">Add game</button></div>
        `)}
        ${state.adminStatus ? `<p class="muted">${esc(state.adminStatus)}</p>` : ""}
      `;
    }

    const views = { dashboard, creators, tournaments, tokens, marketplace, portfolio, rewards, leaderboard, admin };

    function render() {
      const ceo = isCeo(state.address);
      const tabs = ceo ? TABS.concat([["admin", "Admin"]]) : TABS;
      $("tabs").innerHTML = tabs.map(([id, label]) =>
        `<button class="tab${state.tab === id ? " active" : ""}" type="button" data-tab="${id}">${label}</button>`
      ).join("");
      const btn = $("walletBtn");
      btn.textContent = state.busy ? "Waiting…" : state.address ? (ceo ? "CEO " : "") + short(state.address) : "Connect wallet";
      btn.className = state.address ? "btn-ghost" : "btn";
      btn.disabled = state.busy && !state.address;
      $("app").innerHTML = (state.walletError ? `<p class="card err">${esc(state.walletError)}</p>` : "") + (views[state.tab] || dashboard)();
      bind();
    }

    function bind() {
      $("walletBtn").onclick = () => (state.address ? disconnect() : connect());
      document.querySelectorAll("[data-tab]").forEach((el) => {
        el.onclick = () => { state.tab = el.dataset.tab; render(); };
      });
      document.querySelectorAll("[data-frame]").forEach((el) => {
        el.onclick = () => {
          state.frame = state.frame === el.dataset.frame ? "" : el.dataset.frame;
          render();
        };
      });
      $("connectInline") && ($("connectInline").onclick = connect);
      const builder = $("builder");
      if (builder) builder.oninput = () => { state.builderCode = builder.value; };
      $("linkBtn") && ($("linkBtn").onclick = linkStrike);
      $("saveCreator") && ($("saveCreator").onclick = () => {
        const name = $("pinName").value.trim();
        const remixUrl = $("pinUrl").value.trim();
        if (!name || !httpsOnly(remixUrl)) {
          state.adminStatus = "Name and an https profile URL are required.";
          render();
          return;
        }
        state.creator = { name, bio: $("pinBio").value.trim(), remixUrl };
        save("fa_pinned", state.creator);
        state.adminStatus = "Pinned creator saved in this browser.";
        render();
      });
      $("addGame") && ($("addGame").onclick = () => {
        const title = $("gameTitle").value.trim();
        const url = $("gameUrl").value.trim();
        if (!title || !httpsOnly(url)) {
          state.adminStatus = "Title and an https game URL are required.";
          render();
          return;
        }
        state.games.push({ id: Date.now(), title, url, description: $("gameDesc").value.trim() });
        save("fa_games", state.games);
        state.adminStatus = "Game added in this browser.";
        render();
      });
      document.querySelectorAll("[data-remove]").forEach((el) => {
        el.onclick = () => {
          state.games = state.games.filter((g) => String(g.id) !== el.dataset.remove);
          save("fa_games", state.games);
          state.adminStatus = "Game removed in this browser.";
          render();
        };
      });
    }

    (async function boot() {
      const provider = eth();
      if (provider) {
        try {
          const accounts = await provider.request({ method: "eth_accounts" });
          state.address = accounts[0] || null;
          readLink();
        } catch { /* ignore */ }
        provider.on?.("accountsChanged", (accounts) => {
          state.address = accounts[0] || null;
          readLink();
          if (!isCeo(state.address) && state.tab === "admin") state.tab = "dashboard";
          render();
        });
      }
      render();
      loadBoard();
    })();
  </script>
</body>
</html>
